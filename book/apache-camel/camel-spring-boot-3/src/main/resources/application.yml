server:
  port: 9000

route1.timer.period: 1000 # in milliseconds
route3.timer.period: 3000 # in milliseconds
route4.timer.period: 5000 # in milliseconds

camel:
  component:
    kafka:
      brokers: localhost:29092
      auto-offset-reset: earliest
  health.enabled: false

app:
  rest.route: false
  route1: false
  route2: true
  route3: false
  route4: false
  kafka.route: false
  kafka.route.list: false
  # rest-api server.port. This app also binds 9000, so change one port before running both.
  rest-api:
    base-url: http://localhost:9000
    timer.period: 10000
    get.route: false
    post.route: false
    put.route: false
    delete.route: false
    hateoas.route: false
    i18n.route: false
    versioning.route: false
    h2.route: false