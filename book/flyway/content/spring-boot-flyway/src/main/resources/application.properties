spring.application.name=spring-boot-flyway
server.port=9000

spring.datasource.url=jdbc:mysql://localhost:3307/flywayMigration
spring.datasource.username=user1
spring.datasource.password=Password1
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway configurations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The property spring.flyway.baseline-on-migrate=true allows Flyway to initialize version control on an existing database without wiping data
spring.flyway.baseline-on-migrate=true